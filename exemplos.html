<html lang="pt-BR">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="UTF-8" />

    <title>Linguagem Pituguês por Design Líquido - Exemplos</title>
    <link rel="stylesheet" href="./estilos.css" />
    <link rel="stylesheet" href="./codigos.css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono&display=swap" rel="stylesheet" />
    <script src="menu.js"></script>
    <script src="exemplos.js"></script>
</head>

<body class="font-mono bg-gray-50 min-h-screen">

    <div id="mySidenav" class="fixed z-50 top-0 left-0 h-full w-0 overflow-x-hidden bg-white border-r border-[#d9d9d9] transition-all duration-300">
        <a href="javascript:void(0)" class="absolute top-2 right-4 text-4xl hover:text-black" onclick="closeNav()">&times;</a>
        <div class="mt-16 flex flex-col gap-2">
            <a href="index.html" class="px-8 py-2 text-xl text-gray-700 hover:bg-gray-100">Editor</a>
            <a href="exemplos.html" class="px-8 py-2 text-xl text-gray-700 hover:bg-gray-100">Exemplos</a>
        </div>
    </div>

    <nav class="flex items-center p-4 bg-white border-b border-[#d9d9d9]">
        <div class="cursor-pointer p-1 rounded hover:bg-gray-200" onclick="openNav()">
            <i data-lucide="menu"></i>
        </div>
        <div class="ml-4 font-bold text-lg">Exemplos</div>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-8 text-gray-800">Selecione um exemplo</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="group p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-black transition-all duration-300 cursor-pointer" onclick="definirExemplo('OlaMundo')">
                <div class="mb-4 text-gray-400 group-hover:text-black transition-colors"><i data-lucide="terminal" class="w-8 h-8"></i></div>
                <p class="font-bold text-lg text-gray-800">Olá, mundo!</p>
            </div>
            <div class="group p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-black transition-all duration-300 cursor-pointer" onclick="definirExemplo('OperacoesBasicas')">
                <div class="mb-4 text-gray-400 group-hover:text-black transition-colors"><i data-lucide="calculator" class="w-8 h-8"></i></div>
                <p class="font-bold text-lg text-gray-800">Operações básicas</p>
            </div>
            <div class="group p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-black transition-all duration-300 cursor-pointer" onclick="definirExemplo('Condicional')">
                <div class="mb-4 text-gray-400 group-hover:text-black transition-colors"><i data-lucide="git-branch" class="w-8 h-8"></i></div>
                <p class="font-bold text-lg text-gray-800">Condicional</p>
            </div>
            <div class="group p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-black transition-all duration-300 cursor-pointer" onclick="definirExemplo('Classe')">
                <div class="mb-4 text-gray-400 group-hover:text-black transition-colors"><i data-lucide="box" class="w-8 h-8"></i></div>
                <p class="font-bold text-lg text-gray-800">Classe</p>
            </div>
            <div class="group p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-black transition-all duration-300 cursor-pointer" onclick="definirExemplo('MergeSort')">
                <div class="mb-4 text-gray-400 group-hover:text-black transition-colors"><i data-lucide="sort-asc" class="w-8 h-8"></i></div>
                <p class="font-bold text-lg text-gray-800">MergeSort</p>
            </div>
            <div class="group p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-black transition-all duration-300 cursor-pointer" onclick="definirExemplo('Bhaskara')">
                <div class="mb-4 text-gray-400 group-hover:text-black transition-colors"><i data-lucide="sigma" class="w-8 h-8"></i></div>
                <p class="font-bold text-lg text-gray-800">Bhaskara</p>
            </div>
            <div class="group p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-black transition-all duration-300 cursor-pointer" onclick="definirExemplo('Fibonacci')">
                <div class="mb-4 text-gray-400 group-hover:text-black transition-colors"><i data-lucide="trending-up" class="w-8 h-8"></i></div>
                <p class="font-bold text-lg text-gray-800">Fibonacci</p>
            </div>
            <div class="group p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-black transition-all duration-300 cursor-pointer" onclick="definirExemplo('Perceptron')">
                <div class="mb-4 text-gray-400 group-hover:text-black transition-colors"><i data-lucide="brain-circuit" class="w-8 h-8"></i></div>
                <p class="font-bold text-lg text-gray-800">Perceptron</p>
            </div>
            <div class="group p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-black transition-all duration-300 cursor-pointer" onclick="definirExemplo('FilaEstatica')">
                <div class="mb-4 text-gray-400 group-hover:text-black transition-colors"><i data-lucide="layers" class="w-8 h-8"></i></div>
                <p class="font-bold text-lg text-gray-800">Fila Estática</p>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
        function definirExemplo(valor) {
            window.location = 'index.html?exemploId=' + valor;
        }
    </script>
</body>

</html>
